/* ---------- Сурет (локалды өнімдер үшін SVG құтысы) ---------- */
function bottle(title, brand) {
  let h = 0; for (const c of (brand || title)) h = (h * 31 + c.charCodeAt(0)) % 360;
  const ini = (brand || title).split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160"><rect x="48" y="8" width="24" height="18" rx="4" fill="hsl(${h},35%,35%)"/><rect x="54" y="26" width="12" height="10" fill="hsl(${h},20%,70%)"/><rect x="22" y="36" width="76" height="112" rx="16" fill="hsl(${h},60%,62%)"/><rect x="22" y="36" width="76" height="112" rx="16" fill="url(#g)" opacity=".35"/><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient></defs><rect x="36" y="76" width="48" height="36" rx="6" fill="#fff" opacity=".9"/><text x="60" y="101" font-family="Arial" font-weight="700" font-size="18" text-anchor="middle" fill="hsl(${h},40%,25%)">${ini}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
const imgOf = p => p.thumbnail || p.image || (p.images && p.images[0]) || bottle(p.title, p.brand);

  $('list').innerHTML = '<p class="mut">Жүктелуде…</p>';
  let remote = [];
  try {
    const r = await fetch(API + '/category/fragrances');
    remote = (await r.json()).products || [];
  } catch (e) {
    $('count').textContent = 'Серверге қосылу мүмкін болмады, тек жергілікті тізім көрсетілді.';
  }
  items = [...remote.map(p => ({...findDetail(p.title), ...p})), ...TREND.map(p => ({...p}))];
  show(items);
}

    <div class="it" data-id="${esc(p.id)}">
      <img class="th" src="${esc(imgOf(p))}" alt="" loading="lazy">
      <div class="tx"><b>${esc(p.title)}${p.local ? '<span class="tag">тренд</span>' : ''}</b>
        <span class="mut">${esc(p.brand || p.category)} / $${esc(p.price)}</span></div>
      <div class="acts">
        <button class="btn" data-a="get" type="button">GET</button>
        <button class="btn" data-a="edit" type="button">Өзгерту</button>
        <button class="btn del" data-a="del" type="button">Жою</button>
      </div>
    </div>`).join('') : '<p class="mut">Ештеңе табылмады.</p>';
}
 
const byId = id => items.find(p => String(p.id) === String(id));
const isRemote = p => p && !p.local && typeof p.id === 'number' && p.id <= 194;
 
/* ---------- Іздеу ---------- */
function search() {
  const q = $('q').value.trim().toLowerCase();
  $('count').textContent = '';
  show(!q ? items : items.filter(p => [p.title, p.brand, p.category, p.gender, p.family].join(' ').toLowerCase().includes(q)));
}
$('sbtn').onclick = search;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
$('reset').onclick = () => { $('q').value = ''; $('count').textContent = ''; show(items); };
 
/* ---------- GET: толық ақпарат ---------- */
async function info(p) {
  if (isRemote(p)) {
    try { Object.assign(p, await (await fetch(`${API}/${p.id}`)).json()); } catch (e) {}
  }
  const rows = [
    ['Брендтің атауы', p.brand],
    ['Санаты', p.category],
    ['Кімге арналған', p.gender],
    ['Концентрация', p.conc],
    ['Көлемі', p.vol ? p.vol + ' мл' : ''],
    ['Шыққан жылы', p.year],
    ['Хош иіс тобы', p.family],
    ['Маусымы', p.season],
    ['Бағасы', p.price != null ? '$' + p.price + (p.discountPercentage ? ` (жеңілдік ${p.discountPercentage}%)` : '') : ''],
    ['Рейтинг', p.rating],
    ['Қоймада', p.stock],
    ['Түрі (tags)', p.tags && p.tags.length ? p.tags.join(', ') : '']
  ].filter(r => r[1] !== '' && r[1] != null);
  const chips = a => `<div class="chips">${a.map(n => `<span>${esc(n)}</span>`).join('')}</div>`;
  [['Жоғарғы нота', p.top], ['Жүрек нотасы', p.heart], ['Базалық нота', p.base]]
    .forEach(([l, a]) => { if (a && a.length) rows.push([l, chips(a), true]); });
 
  $('iimg').src = imgOf(p);
  $('ititle').textContent = p.title;
  $('idl').innerHTML = rows.map(r => `<dt>${esc(r[0])}</dt><dd>${r[2] ? r[1] : esc(r[1])}</dd>`).join('');
  $('idesc').textContent = p.desc || p.description || '';
  $('info').showModal();
}
$('iclose').onclick = () => $('info').close();
 
/* ---------- Қосу / өңдеу терезесі ---------- */
function openModal(p) {
  editId = p ? p.id : null;
  imgData = '';
  $('mtitle').textContent = p ? 'Өнімді өзгерту' : 'Жаңа өнім';
  $('mbox').hidden = !p;
  $('title').value = p ? p.title : '';
  $('price').value = p ? p.price : '';
  $('category').value = p ? p.category : 'fragrances';
  $('imgfile').value = '';
  $('imgurl').value = p && /^https?:/.test(imgOf(p)) ? imgOf(p) : '';
  $('preview').hidden = !p;
  if (p) $('preview').src = imgOf(p);
  $('modal').showModal();
}
$('add').onclick = () => openModal(null);
$('cancel').onclick = () => $('modal').close();
 
$('imgfile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { imgData = r.result; $('preview').src = imgData; $('preview').hidden = false; };
  r.readAsDataURL(f);
};
$('imgurl').oninput = e => { if (e.target.value) { imgData = ''; $('preview').src = e.target.value; $('preview').hidden = false; } };
 
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const data = {title: $('title').value.trim(), price: parseFloat($('price').value), category: $('category').value.trim()};
  const img = imgData || $('imgurl').value.trim();
  try {
    if (editId === null) {
      let created = {};
      try { created = await (await fetch(API + '/add', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)})).json(); } catch (_) {}
      items.unshift({...data, thumbnail: img, id: 'n' + Date.now(), local: true, desc: 'Жаңадан қосылған өнім.'});
    } else {
      const p = byId(editId);
      if (isRemote(p)) {
        try { await fetch(`${API}/${p.id}`, {method: $('method').value, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)}); } catch (_) {}
      }
      Object.assign(p, data);
      if (img) { p.thumbnail = img; p.image = img; }
    }
  } finally {
    $('modal').close();
    search();
  }
});
 
/* ---------- Тізімдегі батырмалар ---------- */
$('list').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-a]'); if (!btn) return;
  const p = byId(btn.closest('.it').dataset.id); if (!p) return;
  const a = btn.dataset.a;
  if (a === 'get') info(p);
  else if (a === 'edit') openModal(p);
  else if (a === 'del') {
    if (!confirm(`«${p.title}» өнімін жою керек пе?`)) return;
    if (isRemote(p)) { try { await fetch(`${API}/${p.id}`, {method: 'DELETE'}); } catch (_) {} }
    items = items.filter(x => x !== p);
    search();
  }
});
 
load();
</script>
</body>
