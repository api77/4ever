<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRUD — DummyJSON Fake API</title>
<link rel="stylesheet" href="api.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Басты бет</a>
  <h1>Өнімдер: CRUD (dummyjson.com)</h1>
  <p class="mut">Сервер деректі шынымен сақтамайды, өзгерістер тек бетте көрінеді.</p>

  <div class="card">
    <div class="row">
      <div><label for="q">Іздеу</label><input id="q" placeholder="phone"></div>
      <button class="btn" id="sbtn" type="button">Іздеу</button>
      <button class="btn" id="reset" type="button">Барлығы</button>
      <button class="btn p" id="add" type="button">+ Жаңа өнім</button>
    </div>
    <div id="list" aria-live="polite"></div>
    <div class="row" style="margin-top:.8rem"><button class="btn" id="prev" type="button">&larr;</button><span class="mut" id="pg" style="text-align:center"></span><button class="btn" id="next" type="button">&rarr;</button></div>
  </div>
</div>

<!-- Бір модальды терезе: жаңа өнім де, өңдеу де осында -->
<dialog id="modal">
  <form method="dialog" id="form">
    <h2 id="mtitle">Жаңа өнім</h2>
    <div class="mfields">
      <div><label for="title">Атауы</label><input id="title" required></div>
      <div><label for="price">Бағасы</label><input id="price" type="number" step="any" required></div>
      <div><label for="category">Санаты</label><input id="category" required></div>
      <div id="mbox" hidden><label for="method">Әдіс</label><select id="method"><option>PUT</option><option>PATCH</option></select></div>
    </div>
    <div class="row" style="margin-top:1rem;justify-content:flex-end">
      <button class="btn" id="cancel" type="button">Бас тарту</button>
      <button class="btn p" id="save" type="submit">Сақтау</button>
    </div>
  </form>
</dialog>
<!-- Өнім туралы ақпарат (GET) -->
<dialog id="info">
  <img id="iimg" class="ibig" alt="">
  <h2 id="ititle"></h2>
  <dl id="idl" class="idl"></dl>
  <p class="mut" id="idesc"></p>
  <div class="row" style="justify-content:flex-end"><button class="btn p" id="iclose" type="button">Жабу</button></div>
</dialog>
<script src="api.js"></script>
</body>
</html>
