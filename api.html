<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API CRUD — таскілер және авторлар</title>
<link rel="stylesheet" href="api.css">
</head>
<body>
<div class="wrap wide">
  <a class="back" href="index.html">&larr; Басты бет</a>
  <h1>API CRUD: таскілер және авторлар</h1>
  <p class="mut">dummyjson.com. Сервер деректі шынымен сақтамайды, өзгерістер тек бетте көрінеді. Автордың нигін басыңыз.</p>

  <div class="card">
    <form class="row" id="uform">
      <div><label for="uid">Қолданушы ID (бос қалса — барлығы)</label><input id="uid" type="number" min="1" max="208" placeholder="мысалы, 5"></div>
      <button class="btn p" type="submit">GET</button>
    </form>

    <!-- Басты беттегі фильтр, сортировка және жаңа таск батырмасы -->
    <div class="tbar" style="margin-top:.8rem">
      <label class="tool" title="Фильтр"><span aria-hidden="true">▽</span>
        <select id="lflt" aria-label="Фильтр">
          <option value="all">Барлығы</option>
          <option value="todo">Орындалмаған</option>
          <option value="done">Орындалған</option>
        </select>
      </label>
      <label class="tool" title="Сортировка"><span aria-hidden="true">≡</span>
        <select id="lsrt" aria-label="Сортировка">
          <option value="default">Әдепкі</option>
          <option value="az">А → Я</option>
          <option value="za">Я → А</option>
          <option value="status">Орындалмағаны алдымен</option>
        </select>
      </label>
      <button class="btn p round" id="ladd" type="button" aria-label="Жаңа таск қосу" title="Жаңа таск">+</button>
    </div>

    <div class="mut tcount" id="lcount"></div>
    <div id="list" aria-live="polite"></div>
  </div>
</div>

<!-- Автор модальды терезесі: екіге бөлінген (сол жақ — автор, оң жақ — таскілері) -->
<dialog id="umodal">
  <div class="split">
    <section class="pane author">
      <img id="mimg" class="avatar big" alt="" hidden>
      <h2 id="mnick"></h2>
      <p class="mut" id="mname"></p>
      <dl id="mdl" class="idl"></dl>
    </section>

    <section class="pane tasks">
      <div class="tbar">
        <label class="tool" title="Фильтр"><span aria-hidden="true">▽</span>
          <select id="flt" aria-label="Фильтр">
            <option value="all">Барлығы</option>
            <option value="todo">Орындалмаған</option>
            <option value="done">Орындалған</option>
          </select>
        </label>
        <label class="tool" title="Сортировка"><span aria-hidden="true">≡</span>
          <select id="srt" aria-label="Сортировка">
            <option value="default">Әдепкі</option>
            <option value="az">А → Я</option>
            <option value="za">Я → А</option>
            <option value="status">Орындалмағаны алдымен</option>
          </select>
        </label>
        <button class="btn p round" id="tadd" type="button" aria-label="Жаңа таск қосу" title="Жаңа таск">+</button>
        <button class="btn round" id="mclose" type="button" aria-label="Жабу" title="Жабу">✕</button>
      </div>
      <div class="mut tcount" id="mcount"></div>
      <div id="mlist" aria-live="polite"></div>
    </section>
  </div>
</dialog>

<!-- Таск қосу / өзгерту -->
<dialog id="tmodal">
  <form method="dialog" id="tform">
    <h2 id="ttitle">Жаңа таск</h2>
    <div class="mfields">
      <div><label for="ttext">Таск мәтіні</label><input id="ttext" required maxlength="200"></div>
    </div>
    <div class="row" style="margin-top:1rem;justify-content:flex-end">
      <div class="uidbox"><label for="tuid">Қолданушы ID</label><input id="tuid" type="number" min="1" max="208" required></div>
      <button class="btn" id="tcancel" type="button">Бас тарту</button>
      <button class="btn p" type="submit">Сақтау</button>
    </div>
  </form>
</dialog>

<script src="api.js"></script>
</body>
</html>
