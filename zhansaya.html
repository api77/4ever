<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Жансая — DOM тапсырмалары (1-4)</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    transition: background-color 0.3s, color 0.3s;
  }

  h1, h2 { margin-top: 30px; }

  .box {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    width: fit-content;
    cursor: pointer;
    margin: 12px 0;
  }

  .box.active {
    background-color: #ffe066;
    border-color: #f5c400;
  }

  .new-div {
    margin-top: 20px;
    padding: 10px;
    background: #e0f7fa;
    border-radius: 6px;
  }

  .toggle-paragraph {
    cursor: pointer;
    transition: color 0.2s, font-size 0.2s;
  }

  .toggle-paragraph.highlighted {
    color: #d62828;
    font-size: 24px;
  }

  table {
    border-collapse: collapse;
    margin-top: 16px;
  }

  table td {
    width: 40px;
    height: 40px;
    border: 1px solid #999;
    text-align: center;
    cursor: pointer;
    font-size: 12px;
    color: #555;
  }

  #theme-toggle {
    padding: 8px 16px;
    cursor: pointer;
    margin-top: 10px;
  }

  /* Dark theme */
  body.dark-theme {
    background-color: #181818;
    color: #f0f0f0;
  }
  body.dark-theme .box {
    border-color: #555;
    background-color: #2a2a2a;
  }
  body.dark-theme .box.active {
    background-color: #6b5b00;
    border-color: #a68b00;
  }
  body.dark-theme table td {
    border-color: #555;
    color: #ddd;
  }
  body.dark-theme .new-div {
    background: #223;
  }
</style>
</head>
<body>

  <h1 id="main-title">Ескі тақырып</h1>

  <div class="old-element">Бұл элемент жойылады</div>

  <div id="toggle-target" class="box">Мені бас (active класы ауысады)</div>

  <hr>
  <h2>3-тапсырма: Кесте</h2>
  <label>Жолдар: <input type="number" id="rows-input" value="3" min="1" max="20"></label>
  <label>Бағандар: <input type="number" id="cols-input" value="3" min="1" max="20"></label>
  <button id="generate-btn">Кесте құру</button>
  <br><br>
  <label>Түс:
    <select id="color-select">
      <option value="#ffadad">Қызғылт</option>
      <option value="#caffbf">Жасыл</option>
      <option value="#a0c4ff">Көк</option>
      <option value="#fdffb6">Сары</option>
    </select>
  </label>
  <button id="count-btn">Осы түстегі ұяшықтарды санау</button>
  <span id="count-result"></span>
  <div id="table-container"></div>

  <hr>
  <h2>4-тапсырма: Dark theme</h2>
  <button id="theme-toggle">🌙 Қараңғы тақырыпқа ауысу</button>

<script>
  /* ===================== 1-ТАПСЫРМА ===================== */
  const mainTitle = document.getElementById('main-title');
  mainTitle.textContent = 'Сәлем, әлем!';

  const newDiv = document.createElement('div');
  newDiv.className = 'new-div';
  newDiv.textContent = 'Мен жаңа элементпін';
  document.body.appendChild(newDiv);

  const oldElement = document.querySelector('.old-element');
  if (oldElement) oldElement.remove();

  const togglePara = document.createElement('p');
  togglePara.className = 'toggle-paragraph';
  togglePara.textContent = 'Бұл ауыспалы абзац';
  document.body.appendChild(togglePara);

  togglePara.addEventListener('click', () => {
    togglePara.classList.toggle('highlighted');
  });

  /* ===================== 2-ТАПСЫРМА ===================== */
  const toggleTarget = document.getElementById('toggle-target');
  toggleTarget.addEventListener('click', () => {
    toggleTarget.classList.toggle('active');
  });

  console.log('=== Беттегі барлық элементтердің кластары ===');
  document.querySelectorAll('*').forEach((el) => {
    if (el.className && typeof el.className === 'string' && el.className.trim() !== '') {
      console.log(`<${el.tagName.toLowerCase()}> — класстар: "${el.className}"`);
    }
  });

  console.log('=== Тек <p> тегтерінің кластары ===');
  document.querySelectorAll('p').forEach((p, index) => {
    console.log(`p[${index}] — класстар: "${p.className || '(класс жоқ)'}"`);
  });

  /* ===================== 3-ТАПСЫРМА ===================== */
  const generateBtn = document.getElementById('generate-btn');
  const rowsInput = document.getElementById('rows-input');
  const colsInput = document.getElementById('cols-input');
  const tableContainer = document.getElementById('table-container');
  const colorSelect = document.getElementById('color-select');
  const countBtn = document.getElementById('count-btn');
  const countResult = document.getElementById('count-result');

  function createTable(rows, cols, container) {
    container.innerHTML = '';
    const table = document.createElement('table');
    for (let i = 0; i < rows; i++) {
      const tr = document.createElement('tr');
      for (let j = 0; j < cols; j++) {
        const td = document.createElement('td');
        td.textContent = `${i + 1}-${j + 1}`;
        td.addEventListener('click', () => {
          const chosenColor = colorSelect.value;
          if (td.dataset.color === chosenColor) {
            td.style.backgroundColor = '';
            delete td.dataset.color;
          } else {
            td.style.backgroundColor = chosenColor;
            td.dataset.color = chosenColor;
          }
        });
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }
    container.appendChild(table);
  }

  generateBtn.addEventListener('click', () => {
    const rows = parseInt(rowsInput.value, 10) || 1;
    const cols = parseInt(colsInput.value, 10) || 1;
    createTable(rows, cols, tableContainer);
    countResult.textContent = '';
  });

  function countCellsByColor(color) {
    const cells = tableContainer.querySelectorAll('td');
    let count = 0;
    cells.forEach((td) => {
      if (td.dataset.color === color) count++;
    });
    return count;
  }

  countBtn.addEventListener('click', () => {
    const color = colorSelect.value;
    const total = countCellsByColor(color);
    countResult.textContent = ` → Осы түсте ${total} ұяшық бар`;
  });

  createTable(parseInt(rowsInput.value, 10), parseInt(colsInput.value, 10), tableContainer);

  /* ===================== 4-ТАПСЫРМА ===================== */
  const themeToggle = document.getElementById('theme-toggle');

  function applyTheme(isDark) {
    document.body.classList.toggle('dark-theme', isDark);
    themeToggle.textContent = isDark
      ? '☀️ Ашық тақырыпқа ауысу'
      : '🌙 Қараңғы тақырыпқа ауысу';
  }

  const savedTheme = localStorage.getItem('theme');
  applyTheme(savedTheme === 'dark');

  themeToggle.addEventListener('click', () => {
    const isDarkNow = !document.body.classList.contains('dark-theme');
    applyTheme(isDarkNow);
    localStorage.setItem('theme', isDarkNow ? 'dark' : 'light');
  });
</script>

</body>
</html>
